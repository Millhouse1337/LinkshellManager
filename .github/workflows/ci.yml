name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LinkshellManagerDiscordApp.sln

      - name: Build (Release)
        run: dotnet build LinkshellManagerDiscordApp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LinkshellManagerDiscordApp.sln --configuration Release --no-build --verbosity normal

  angular:
    name: Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-activity
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: discord-activity/package-lock.json

      # Match the npm major that authored package-lock.json (lockfileVersion 3,
      # npm 11) so `npm ci`'s strict check interprets it the same way.
      - name: Pin npm
        run: npm install -g npm@11

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
